<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>透析解析レポート Pro - モバイル（フッタ固定改善）</title>
<style>
:root{
  --bg:#f4f6f9;
  --card:#fff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --muted:#6b7280;
  --radius:12px;
}
html,body{height:100%;margin:0;font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:#111827}
.container{max-width:720px;margin:0 auto;padding:12px 12px 140px} /* 下部余白を大きめに確保 */
.card{background:var(--card);border-radius:var(--radius);padding:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);margin-bottom:12px}
.header{display:flex;align-items:center;gap:10px}
.h1{font-size:18px;margin:0}
.small{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:900px){ .grid{grid-template-columns:1fr} }
label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
input,textarea,select,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;box-sizing:border-box}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.form-row{display:flex;flex-direction:column;margin-bottom:8px}
.collapsible{background:#fbfdff;border-radius:10px;padding:8px;margin-top:8px}
.toggle-btn{background:#f1f5f9;border-radius:8px;padding:8px 10px;border:1px solid #e6eefc;color:#0f172a;font-weight:700}
.kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kpi{flex:1;min-width:120px;background:#f9fbff;border:1px solid #dbeafe;border-radius:10px;padding:8px;text-align:center}
.kpi .label{font-size:12px;color:var(--muted)}
.kpi .value{font-size:18px;font-weight:700;color:var(--primary);margin-top:6px}
.table{width:100%;border-collapse:collapse;margin-top:8px}
.table th,.table td{padding:6px;border-bottom:1px solid #eef2ff;font-size:13px;text-align:left}

/* フッタ（固定） */
.footer-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.95),#fff);
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
  box-shadow:0 -6px 18px rgba(0,0,0,0.06);
  z-index:9999; /* 前面に出す */
  /* safe area for iPhone notch */
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  /* 横スクロール可能にしてボタンが隠れないようにする */
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

/* ボタンは固定幅で横に並べる（スクロールでアクセス） */
.footer-bar .btn{
  flex:0 0 auto;
  min-width:84px;
  padding:10px 12px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
  margin-right:6px;
}

/* 色 */
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-secondary{background:#e5e7eb}
.btn-danger{background:var(--danger);color:#fff}

/* 印刷用調整 */
@media print{
  @page { size: A4 portrait; margin: 8mm; }
  html,body{background:#fff}
  .footer-bar, .toggle-btn, input, textarea, button { display:none !important; }
  .container{max-width:190mm;padding:0;margin:0}
  .card{box-shadow:none;border:0;padding:6px;border-radius:0}
  .kpi .value{font-size:16px}
  .table th,.table td{font-size:11px;padding:4px}
  .card, #resultsCard { page-break-inside: avoid; }
  body { -webkit-print-color-adjust: exact; }
}

/* 小画面での視認性向上 */
@media(max-width:420px){
  .container{padding:10px 10px 160px}
  .footer-bar .btn{min-width:72px;padding:8px 10px;font-size:14px}
}
</style>
</head>
<body>
<div class="container">

  <div class="card header">
    <div style="flex:1">
      <div class="h1">透析解析レポート Pro</div>
      <div class="small">スマホ入力・印刷対応</div>
    </div>
    <div style="font-size:12px;color:var(--muted)">v1</div>
  </div>

  <div class="card" id="mainForm">
    <div class="form-row">
      <input id="patientId" type="text" placeholder="患者ID（必須）" aria-label="患者ID">
    </div>

    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="examDate" type="date" aria-label="採血日" style="flex:1">
      <input id="dialysisTime" type="number" placeholder="透析時間 分" aria-label="透析時間" style="width:120px">
    </div>

    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="K" type="number" placeholder="K" aria-label="K" style="flex:1">
      <input id="Ca" type="number" placeholder="Ca" aria-label="Ca" style="flex:1">
      <input id="Alb" type="number" placeholder="Alb" aria-label="Alb" style="flex:1">
    </div>

    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="P" type="number" placeholder="P" aria-label="P" style="flex:1">
      <input id="iPTH" type="number" placeholder="iPTH" aria-label="iPTH" style="flex:1">
      <input id="Hb" type="number" placeholder="Hb" aria-label="Hb" style="flex:1">
    </div>

    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="Fe" type="number" placeholder="Fe" aria-label="Fe" style="flex:1">
      <input id="TIBC" type="number" placeholder="TIBC" aria-label="TIBC" style="flex:1">
      <input id="Ferritin" type="number" placeholder="Ferritin" aria-label="Ferritin" style="flex:1">
    </div>

    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="BUNpre" type="number" placeholder="BUN前" aria-label="BUN前" style="flex:1">
      <input id="BUNpost" type="number" placeholder="BUN後" aria-label="BUN後" style="flex:1">
      <input id="UF" type="number" placeholder="除水量 kg" aria-label="除水量" style="width:120px">
    </div>

    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="height" type="number" placeholder="身長 cm" aria-label="身長" style="flex:1">
      <input id="weightPre" type="number" placeholder="透析前体重 kg" aria-label="透析前体重" style="flex:1">
      <input id="weightPost" type="number" placeholder="透析後体重 kg" aria-label="透析後体重" style="flex:1">
    </div>

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <button class="toggle-btn" id="toggleDetail" onclick="toggleDetail()">詳細を表示</button>
      <div class="small">詳細は折りたたみ</div>
    </div>

    <div id="detailArea" class="collapsible" style="display:none">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="BMI" type="number" placeholder="BMI" aria-label="BMI" style="flex:1">
        <input id="NRIAlb" type="number" placeholder="Alb（NRI用）" aria-label="Alb for NRI" style="flex:1">
        <input id="Cr" type="number" placeholder="Cr" aria-label="Cr" style="flex:1">
      </div>
      <div style="margin-bottom:8px">
        <input id="TCHO" type="number" placeholder="総コレステロール" aria-label="総コレステロール">
      </div>
      <div style="margin-bottom:8px">
        <input id="correctedCa" type="number" placeholder="補正Ca（任意）" aria-label="補正Ca">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="GNRI" type="number" placeholder="GNRI（任意）" aria-label="GNRI" style="flex:1">
        <input id="spKtV" type="number" step="0.01" placeholder="spKt/V（任意）" aria-label="spKtV" style="flex:1">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="nPCR" type="number" step="0.01" placeholder="nPCR（任意）" aria-label="nPCR" style="flex:1">
        <input id="logicVersion" type="text" placeholder="計算ロジックバージョン" aria-label="計算ロジックバージョン" style="flex:1">
      </div>
      <div>
        <textarea id="ceComment" placeholder="CEコメント（任意）" aria-label="CEコメント" style="min-height:80px"></textarea>
      </div>
    </div>

    <div id="resultsCard" class="card" style="margin-top:8px;display:none"></div>

  </div>

</div>

<!-- 固定フッタ（横スクロール可） -->
<div class="footer-bar" role="toolbar" aria-label="操作バー">
  <button class="btn btn-primary" onclick="loadHistory()" id="btnLoad">呼び出し</button>
  <button class="btn btn-primary" onclick="calc()" id="btnCalc">解析</button>
  <button class="btn btn-success" onclick="submitToGoogleForm()" id="btnSend">送信</button>
  <button class="btn btn-secondary" onclick="printReport()" id="btnPrint">印刷</button>
  <button class="btn btn-danger" onclick="clearForm()">クリア</button>
</div>

<script>
/* Google フォーム送信先（既存） */
const GOOGLE_FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSeY4hJIo8fqT__MURh4__OJCJJFC7OuAIN0m93NezKSxWwXhA/formResponse";

/* ENTRY マップ（元のまま） */
const ENTRY = {
  patientId:"entry.1408149842",
  examDate:"entry.682524855",
  K:"entry.902839305",
  Ca:"entry.1282247271",
  Alb:"entry.553676846",
  P:"entry.1122270247",
  iPTH:"entry.828508291",
  Hb:"entry.1432055817",
  Fe:"entry.269083043",
  TIBC:"entry.905449551",
  Ferritin:"entry.1043305105",
  BUNpre:"entry.1271587686",
  BUNpost:"entry.2051670408",
  dialysisTime:"entry.1989053109",
  UF:"entry.1017877093",
  height:"entry.2020297135",
  weightPre:"entry.1596697131",
  weightPost:"entry.2120517553",
  correctedCa:"entry.1346758513",
  GNRI:"entry.1014469604",
  spKtV:"entry.1879519402",
  nPCR:"entry.522730033",
  logicVersion:"entry.1563221666",
  ceComment:"entry.1014469604",
  NRIJH:"entry.1596697131"
};

/* ユーティリティ */
function el(id){ return document.getElementById(id); }
function getNum(id){ const e=el(id); if(!e) return null; const v=e.value; if(v===""||v==null) return null; const n=parseFloat(String(v).replace(/,/g,'')); return Number.isFinite(n)?n:null; }
function esc(s){ return String(s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 折りたたみ */
function toggleDetail(){
  const area = el("detailArea");
  const btn = el("toggleDetail");
  if(area.style.display === "none" || area.style.display === ""){
    area.style.display = "block";
    btn.textContent = "詳細を隠す";
  } else {
    area.style.display = "none";
    btn.textContent = "詳細を表示";
  }
}

/* 解析 */
function calc(){
  const K = getNum("K");
  const Ca = getNum("Ca");
  const Alb = getNum("Alb");
  const P = getNum("P");
  const iPTH = getNum("iPTH");
  const Hb = getNum("Hb");
  const Fe = getNum("Fe");
  const TIBC = getNum("TIBC");
  const Ferritin = getNum("Ferritin");
  const BUNpre = getNum("BUNpre");
  const BUNpost = getNum("BUNpost");
  const dialysisTime = getNum("dialysisTime");
  const UF = getNum("UF");
  const height = getNum("height");
  const weightPre = getNum("weightPre");

  const BMI = getNum("BMI");
  const Cr = getNum("Cr");
  const TCHO = getNum("TCHO");

  let correctedCa = null;
  if(Ca!=null && Alb!=null) correctedCa = Ca + 0.8*(4 - Alb);

  let TSAT = null;
  if(Fe!=null && TIBC!=null && TIBC!==0) TSAT = (Fe/TIBC)*100;

  let spKtV = null;
  if(BUNpre!=null && BUNpost!=null && dialysisTime!=null && weightPre!=null && BUNpre>0){
    const t = dialysisTime/60;
    const R = BUNpost/BUNpre;
    const arg = R - 0.008*t;
    if(arg>0){
      const ufRatio = (UF!=null && weightPre!==0)?(UF/weightPre):0;
      try{
        const v = -Math.log(arg) + (4 - 3.5*R)*ufRatio;
        spKtV = Number.isFinite(v)?v:null;
      }catch(e){ spKtV = null; }
    }
  }

  let GNRI = null;
  if(Alb!=null && height!=null && weightPre!=null && height>0){
    const ideal = 22 * Math.pow(height/100,2);
    if(ideal>0){
      GNRI = 1.489*(Alb*10) + 41.7*(weightPre/ideal);
      if(!Number.isFinite(GNRI)) GNRI = null;
    }
  }

  let NRIJH = 0;
  const nriInputsPresent = (BMI!=null || Alb!=null || Cr!=null || TCHO!=null);
  if(nriInputsPresent){
    if(BMI!=null && BMI<20) NRIJH+=1;
    if(Alb!=null && Alb<3.6) NRIJH+=1;
    if(Cr!=null && Cr<10) NRIJH+=1;
    if(TCHO!=null && TCHO<130) NRIJH+=1;
  } else {
    NRIJH = "";
  }

  const results = el("resultsCard");
  let html = `<div style="font-weight:700;margin-bottom:6px">患者ID: ${esc(el("patientId").value || "—")}</div>`;
  html += `<div class="kpi-row">`;
  html += `<div class="kpi"><div class="label">spKt/V</div><div class="value">${spKtV!=null?spKtV.toFixed(2):"—"}</div></div>`;
  html += `<div class="kpi"><div class="label">GNRI</div><div class="value">${GNRI!=null?GNRI.toFixed(1):"—"}</div></div>`;
  html += `<div class="kpi"><div class="label">補正Ca</div><div class="value">${correctedCa!=null?correctedCa.toFixed(2):"—"}</div></div>`;
  html += `<div class="kpi"><div class="label">NRI-JH</div><div class="value">${NRIJH!==""?esc(String(NRIJH)):"—"}</div></div>`;
  html += `</div>`;

  html += `<table class="table"><tr><th>項目</th><th>値</th></tr>`;
  function row(name,val){ html += `<tr><td>${esc(name)}</td><td>${val!=null?esc(String(Number(val).toFixed(2))):"—"}</td></tr>`; }
  row("K",K); row("Hb",Hb); row("P",P); row("TSAT",TSAT); row("Ferritin",Ferritin); row("補正Ca",correctedCa); row("spKt/V",spKtV); row("GNRI",GNRI);
  html += `</table>`;
  html += `<div style="margin-top:8px"><div style="font-weight:700">CEコメント</div><div class="small">${esc(el("ceComment")?.value || "なし")}</div></div>`;

  results.innerHTML = html;
  results.style.display = "block";
  setTimeout(()=>{ results.scrollIntoView({behavior:"smooth",block:"center"}); },100);
}

/* 印刷 */
function printReport(){
  if(el("resultsCard").style.display === "none" || el("resultsCard").innerHTML.trim() === ""){
    calc();
  }
  // 少し待ってから印刷（レンダリング安定化）
  setTimeout(()=> window.print(), 300);
}

/* データ呼び出し（簡易） */
const SAMPLE_DATA = [
  { id:"TEST-001", date:"2026-05-11", K:3.6, Ca:9.96, Alb:2.8, P:3.2, BUNpre:26.5, BUNpost:9.7, dialysisTime:240, UF:1.8, height:154, ceComment:"テストデータ1"},
  { id:"116848", date:"2026-04-14", K:3.4, Ca:9.98, Alb:1.9, P:3.4, BUNpre:44.1, BUNpost:19.3, dialysisTime:240, UF:0.4, height:174.2, ceComment:"過去データサンプル"}
];

function loadHistory(){
  // モバイル向けに prompt で選択（実運用では API 連携に置換）
  let list = "呼び出すデータを番号で選択してください:\n";
  SAMPLE_DATA.forEach((s,i)=> list += `${i+1}. ${s.id} (${s.date})\n`);
  const sel = prompt(list);
  if(!sel) return;
  const idx = parseInt(sel,10) - 1;
  if(isNaN(idx) || idx < 0 || idx >= SAMPLE_DATA.length){
    alert("無効な選択です");
    return;
  }
  const d = SAMPLE_DATA[idx];
  const setIf = (id,val) => { const e = el(id); if(e) e.value = val==null?"":val; };
  setIf("patientId", d.id);
  setIf("examDate", d.date);
  setIf("K", d.K);
  setIf("Ca", d.Ca);
  setIf("Alb", d.Alb);
  setIf("P", d.P);
  setIf("BUNpre", d.BUNpre);
  setIf("BUNpost", d.BUNpost);
  setIf("dialysisTime", d.dialysisTime);
  setIf("UF", d.UF);
  setIf("height", d.height);
  setIf("ceComment", d.ceComment);
  calc();
}

/* Google フォーム送信（簡易） */
let submitting = false;
function submitToGoogleForm(){
  if(submitting) return;
  if(!el("patientId").value){
    alert("患者ID を入力してください");
    el("patientId").focus();
    return;
  }
  if(!el("examDate").value){
    alert("採血日 を入力してください");
    el("examDate").focus();
    return;
  }

  submitting = true;
  const btn = el("btnSend");
  if(btn) btn.disabled = true;
  const calcBtn = el("btnCalc"); if(calcBtn) calcBtn.disabled = true;

  const form = document.createElement("form");
  form.method = "POST";
  form.action = GOOGLE_FORM_ACTION;
  form.target = "hidden_iframe";

  function add(name, val){
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = name;
    input.value = val || "";
    form.appendChild(input);
  }

  Object.keys(ENTRY).forEach(key=>{
    add(ENTRY[key], el(key) ? el(key).value : "");
  });

  document.body.appendChild(form);

  let iframe = document.getElementById("hidden_iframe");
  if(!iframe){
    iframe = document.createElement("iframe");
    iframe.name = "hidden_iframe";
    iframe.id = "hidden_iframe";
    iframe.style.display = "none";
    document.body.appendChild(iframe);
  }

  iframe.onload = function(){
    submitting = false;
    if(btn) btn.disabled = false;
    if(calcBtn) calcBtn.disabled = false;
    alert("送信完了");
    try{ form.remove(); }catch(e){}
  };

  setTimeout(()=>{
    if(submitting){
      submitting = false;
      if(btn) btn.disabled = false;
      if(calcBtn) calcBtn.disabled = false;
      alert("送信を完了した可能性があります。スプレッドシートを確認してください。");
      try{ form.remove(); }catch(e){}
    }
  },10000);

  form.submit();
}

/* クリア */
function clearForm(){
  if(!confirm("入力をクリアしますか？")) return;
  document.querySelectorAll("input,textarea").forEach(e=>e.value="");
  el("resultsCard").style.display = "none";
  el("detailArea").style.display = "none";
  el("toggleDetail").textContent = "詳細を表示";
}

/* 初期化 */
(function(){
  const d = new Date();
  el("examDate").value = d.toISOString().slice(0,10);
})();
</script>
</body>
</html>
