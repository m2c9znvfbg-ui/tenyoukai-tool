<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>透析解析レポート Pro（フォーム送信 デバッグ付き）</title>
<style>
body{font-family:"Noto Sans JP",sans-serif;margin:16px;background:#f4f6f9;color:#111827}
.wrap{max-width:1100px;margin:auto}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
label{font-size:12px;color:#6b7280;display:block;margin-bottom:6px}
input,textarea,select{width:100%;padding:8px;border-radius:8px;border:1px solid #d1d5db;box-sizing:border-box}
button{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
.btn-primary{background:#2563eb;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-secondary{background:#e5e7eb}
#previewBox{white-space:pre-wrap;background:#fff;border:1px solid #e5e7eb;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.notice{font-size:13px;color:#6b7280}
.warn{color:#dc2626;font-weight:700}
.ok{color:#16a34a;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h2>透析解析レポート Pro（送信プレビュー付き）</h2>

    <div class="grid">
      <div><label for="patientId">患者ID</label><input id="patientId" type="text"></div>
      <div><label for="examDate">採血日</label><input id="examDate" type="date"></div>
      <div><label for="K">K</label><input id="K" type="number" step="0.1"></div>
      <div><label for="Ca">Ca</label><input id="Ca" type="number" step="0.1"></div>
      <div><label for="Alb">Alb</label><input id="Alb" type="number" step="0.1"></div>
      <div><label for="P">P</label><input id="P" type="number" step="0.1"></div>
      <div><label for="iPTH">iPTH</label><input id="iPTH" type="number" step="1"></div>
      <div><label for="Hb">Hb</label><input id="Hb" type="number" step="0.1"></div>
      <div><label for="Fe">Fe</label><input id="Fe" type="number" step="1"></div>
      <div><label for="TIBC">TIBC</label><input id="TIBC" type="number" step="1"></div>
      <div><label for="Ferritin">Ferritin</label><input id="Ferritin" type="number" step="1"></div>
      <div><label for="BUNpre">BUN前</label><input id="BUNpre" type="number" step="0.1"></div>
      <div><label for="BUNpost">BUN後</label><input id="BUNpost" type="number" step="0.1"></div>
      <div><label for="dialysisTime">透析時間 分</label><input id="dialysisTime" type="number" step="1"></div>
      <div><label for="UF">除水量 kg</label><input id="UF" type="number" step="0.1"></div>
      <div><label for="height">身長 cm</label><input id="height" type="number" step="0.1"></div>
      <div><label for="weightPre">透析前体重 kg</label><input id="weightPre" type="number" step="0.1"></div>
      <div><label for="weightPost">透析後体重 kg</label><input id="weightPost" type="number" step="0.1"></div>
      <div><label for="ceComment">CEコメント</label><textarea id="ceComment"></textarea></div>
    </div>

    <div style="margin-top:12px;">
      <button class="btn-primary" onclick="previewMapping()">プレビュー（送信データ確認）</button>
      <button id="btnSend" class="btn-success" onclick="submitToGoogleFormOrdered()">スプレッドシートへ送信</button>
      <span class="notice">※ まずプレビューで entry と値の対応を必ず確認してください。</span>
    </div>

    <div id="status" style="margin-top:10px"></div>

    <div id="previewBox" style="display:none"></div>

    <div style="margin-top:12px;">
      <b>デバッグ用：ENTRY_ORDER（列順） と ENTRY_IDS（entry ID の配列）</b>
      <div class="notice">必要ならここを編集してフォームの実際の entry ID に合わせてください（開発者ツールで確認）。</div>
      <textarea id="debugEntryIds" style="width:100%;height:120px;margin-top:8px;">
// ENTRY_ORDER: スプレッドシートのヘッダ順（左から右）
["timestamp","patientId","examDate","K","Ca","Alb","P","iPTH","Hb","Fe","TIBC","Ferritin","BUNpre","BUNpost","dialysisTime","UF","height","weightPre","weightPost","correctedCa","GNRI","spKtV","nPCR","saltEst","logicVersion","ceComment","nriJH"]

// ENTRY_IDS: 上の順序に対応する entry.XXXXX をカンマ区切りで並べる（必ず 27 個）
["","entry.1408149842","entry.682524855","entry.902839305","entry.1282247271","entry.553676846","entry.1122270247","entry.828508291","entry.1432055817","entry.269083043","entry.905449551","entry.1043305105","entry.1271587686","entry.2051670408","entry.1989053109","entry.1017877093","entry.2020297135","entry.1596697131","entry.2120517553","entry.1346758513","entry.1014469604","entry.1879519402","entry.522730033","entry.1468863185","entry.1563221666","entry.1014469604","entry.1596697131"]
      </textarea>
      <div class="notice" style="margin-top:6px">※ 上の配列はサンプルです。フォームの実際の entry ID と一致させてください。</div>
    </div>

  </div>

</div>

<script>
const GOOGLE_FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSeY4hJIo8fqT__MURh4__OJCJJFC7OuAIN0m93NezKSxWwXhA/formResponse";

function el(id){ return document.getElementById(id); }

// previewMapping: プレビュー表示（送信される name と value の一覧）
function previewMapping(){
  // debug 配列を eval して ENTRY_ORDER と ENTRY_IDS を取得（ユーザーが編集可能）
  let txt = el("debugEntryIds").value;
  // 安全のため eval を限定的に使う：配列リテラルを抽出して JSON.parse で処理
  // まず配列リテラルをすべて抽出
  const arrMatches = txt.match(/

\[([\s\S]*?)\]

/g);
  if(!arrMatches || arrMatches.length < 2){
    el("previewBox").style.display = "block";
    el("previewBox").textContent = "ERROR: debugEntryIds の形式が正しくありません。2つの配列リテラル（ENTRY_ORDER と ENTRY_IDS）を含めてください。";
    return;
  }
  try{
    const orderJson = arrMatches[0];
    const idsJson = arrMatches[1];
    const ENTRY_ORDER = JSON.parse(orderJson.replace(/(['"])?([a-zA-Z0-9_]+)(['"])?/g, function(m,q1,key,q3){
      // ensure strings are quoted for JSON.parse if not already
      if(q1) return m;
      return '"'+key+'"';
    }));
    const ENTRY_IDS = JSON.parse(idsJson.replace(/(['"])?(entry\.\d+|[a-zA-Z0-9_]+)(['"])?/g, function(m,q1,key,q3){
      if(q1) return m;
      return '"'+key+'"';
    }));
    if(ENTRY_ORDER.length !== ENTRY_IDS.length){
      el("previewBox").style.display = "block";
      el("previewBox").textContent = "ERROR: ENTRY_ORDER と ENTRY_IDS の長さが一致しません。順序配列と ID 配列は同じ長さである必要があります。";
      return;
    }

    // 送信データを組み立て（空欄も含む）
    const pairs = [];
    ENTRY_ORDER.forEach((key, idx) => {
      const entryName = ENTRY_IDS[idx] || "";
      // 値はページ上の id と同じキー名を参照（存在しなければ空）
      const sourceEl = document.getElementById(key);
      const value = sourceEl ? (sourceEl.value || "") : "";
      pairs.push({colKey:key, entry:entryName, value:value});
    });

    // プレビュー表示
    let out = "送信プレビュー（左からスプレッドシート列順）\n\n";
    out += "列キー\t\tentry name\t\tvalue\n";
    out += "------------------------------------------------------------\n";
    pairs.forEach(p=>{
      out += `${p.colKey}\t${p.entry}\t${p.value}\n`;
    });
    el("previewBox").style.display = "block";
    el("previewBox").textContent = out;
    el("status").textContent = "プレビュー表示しました。内容を確認してください。";
  }catch(e){
    el("previewBox").style.display = "block";
    el("previewBox").textContent = "ERROR: プレビュー生成中に例外が発生しました。debugEntryIds の形式を確認してください。\n"+e;
  }
}

// submitToGoogleFormOrdered: preview で使う配列を読み取り、順序固定で送信
let isSubmitting = false;
function submitToGoogleFormOrdered(){
  if(isSubmitting) return;
  // まずプレビューを表示してユーザーに確認させることを強制
  if(el("previewBox").style.display === "none"){
    alert("まず「プレビュー（送信データ確認）」を押して、entry と値の対応を確認してください。");
    return;
  }

  // 取得 debug 配列
  let txt = el("debugEntryIds").value;
  const arrMatches = txt.match(/

\[([\s\S]*?)\]

/g);
  if(!arrMatches || arrMatches.length < 2){
    alert("debugEntryIds の形式が正しくありません。");
    return;
  }
  try{
    const orderJson = arrMatches[0];
    const idsJson = arrMatches[1];
    const ENTRY_ORDER = JSON.parse(orderJson.replace(/(['"])?([a-zA-Z0-9_]+)(['"])?/g, function(m,q1,key,q3){
      if(q1) return m;
      return '"'+key+'"';
    }));
    const ENTRY_IDS = JSON.parse(idsJson.replace(/(['"])?(entry\.\d+|[a-zA-Z0-9_]+)(['"])?/g, function(m,q1,key,q3){
      if(q1) return m;
      return '"'+key+'"';
    }));
    if(ENTRY_ORDER.length !== ENTRY_IDS.length){
      alert("ENTRY_ORDER と ENTRY_IDS の長さが一致しません。");
      return;
    }

    // 確認ダイアログ（最終確認）
    if(!confirm("送信を実行します。よろしいですか？（送信後はスプレッドシートで結果を確認してください）")) return;

    isSubmitting = true;
    el("status").textContent = "送信中...";
    const btn = document.getElementById("btnSend");
    if(btn) btn.disabled = true;

    const form = document.createElement("form");
    form.method = "POST";
    form.action = GOOGLE_FORM_ACTION;
    form.target = "hidden_iframe";

    ENTRY_ORDER.forEach((key, idx) => {
      const entryName = ENTRY_IDS[idx] || "";
      if(!entryName) return; // timestamp 等は送らない
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = entryName;
      const sourceEl = document.getElementById(key);
      input.value = sourceEl ? (sourceEl.value || "") : "";
      form.appendChild(input);
    });

    document.body.appendChild(form);

    let iframe = document.getElementById("hidden_iframe");
    if(!iframe){
      iframe = document.createElement("iframe");
      iframe.name = "hidden_iframe";
      iframe.id = "hidden_iframe";
      iframe.style.display = "none";
      document.body.appendChild(iframe);
    }

    let done = false;
    function finish(ok){
      if(done) return;
      done = true;
      isSubmitting = false;
      if(btn) btn.disabled = false;
      try{ form.remove(); }catch(e){}
      el("status").innerHTML = ok ? "<span class='ok'>送信完了</span>" : "<span class='warn'>送信失敗</span>";
    }

    iframe.onload = function(){ finish(true); };
    const fallbackTimer = setTimeout(()=> finish(true), 10000);

    try{
      form.submit();
    }catch(e){
      clearTimeout(fallbackTimer);
      finish(false);
    }

  }catch(e){
    alert("送信準備中にエラーが発生しました。debugEntryIds を確認してください。\n"+e);
    return;
  }
}

// 初期化：採血日に今日をセット
(function setToday(){
  const d = new Date();
  const s = d.toISOString().slice(0,10);
  const e = document.getElementById("examDate");
  if(e) e.value = s;
})();
</script>
</body>
</html>
