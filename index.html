<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>透析解析レポート（NRI-JH対応版）</title>

<style>
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  margin:0;
  padding:14px;
  background:#f4f6f9;
  color:#111827;
}
.wrap{
  max-width:1100px;
  margin:auto;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.05);
}
.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
@media(max-width:700px){
  .grid-2{
    grid-template-columns:1fr;
  }
}
input{
  width:100%;
  padding:8px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:14px;
  box-sizing:border-box;
}
button{
  border:none;
  border-radius:8px;
  padding:10px;
  font-weight:700;
  cursor:pointer;
  width:100%;
}
.primary{
  background:#0b5ed7;
  color:#fff;
}
.secondary{
  background:#e5e7eb;
  color:#111827;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}
th,td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
  font-size:13px;
}
th{
  background:#f9fafb;
}
.ok{
  color:#0f9d58;
  font-weight:700;
}
.warn{
  color:#d9534f;
  font-weight:700;
}
.result-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:12px;
}
@media(max-width:700px){
  .result-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
.kpi{
  background:#f8fbff;
  border:1px solid #dbeafe;
  border-radius:10px;
  padding:10px;
  text-align:center;
}
.kpi .label{
  font-size:12px;
  color:#6b7280;
}
.kpi .value{
  font-size:20px;
  font-weight:700;
  color:#0b5ed7;
  margin-top:6px;
}
textarea{
  width:100%;
  min-height:90px;
  border-radius:8px;
  border:1px solid #d1d5db;
  padding:8px;
  box-sizing:border-box;
}
.notice{
  font-size:12px;
  color:#6b7280;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h2>透析解析レポート</h2>

    <div class="grid-2">
      <div>
        <label>患者ID</label>
        <input id="patientId">
      </div>

      <div>
        <label>採血日</label>
        <input type="date" id="examDate">
      </div>
    </div>
  </div>

  <div class="card">

    <h3>検査値入力</h3>

    <div class="grid-2">

      <input id="K" placeholder="K">
      <input id="Ca" placeholder="Ca">

      <input id="Alb" placeholder="Alb">
      <input id="P" placeholder="P">

      <input id="iPTH" placeholder="iPTH">
      <input id="Hb" placeholder="Hb">

      <input id="Fe" placeholder="Fe">
      <input id="TIBC" placeholder="TIBC">

      <input id="Ferritin" placeholder="Ferritin">
      <input id="BUNpre" placeholder="BUN前">

      <input id="BUNpost" placeholder="BUN後">
      <input id="dialysisTime" placeholder="透析時間（分）">

      <input id="UF" placeholder="除水量（kg）">
      <input id="height" placeholder="身長（cm）">

      <input id="weightPre" placeholder="透析前体重（kg）">
      <input id="weightPost" placeholder="透析後体重（kg）">

    </div>

    <hr style="margin:18px 0">

    <h3>NRI-JH入力</h3>

    <div class="grid-2">

      <input id="BMI" placeholder="BMI">
      <input id="Cr" placeholder="Cr">

      <input id="TCho" placeholder="総コレステロール">

    </div>

    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="primary" onclick="calc()">解析実行</button>
      <button class="secondary" onclick="window.print()">印刷</button>
    </div>

  </div>

  <div id="results" class="card" style="display:none"></div>

</div>

<script>

const el = id => document.getElementById(id);

const num = v=>{
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
};

const clamp = (v,min,max)=>{
  return Math.max(min,Math.min(max,v));
};

function judge(val,min,max){

  if(val == null) return "";

  if(min != null && val < min) return "warn";

  if(max != null && val > max) return "warn";

  return "ok";
}

function row(name,val,target,min,max){

  const cls = judge(val,min,max);

  const label =
    cls === "ok"
    ? '<span class="ok">OK</span>'
    : cls === "warn"
    ? '<span class="warn">要対応</span>'
    : '';

  return `
  <tr>
    <td>${name}</td>
    <td>${val != null ? (typeof val === "number" ? val.toFixed(2) : val) : "—"}</td>
    <td>${target || "—"}</td>
    <td>${label}</td>
  </tr>
  `;
}

function calc(){

  const patientId = el("patientId").value;

  const examDate = el("examDate").value;

  const K = num(el("K").value);
  const Ca = num(el("Ca").value);
  const Alb = num(el("Alb").value);
  const P = num(el("P").value);
  const iPTH = num(el("iPTH").value);
  const Hb = num(el("Hb").value);
  const Fe = num(el("Fe").value);
  const TIBC = num(el("TIBC").value);
  const Ferritin = num(el("Ferritin").value);

  const BUNpre = num(el("BUNpre").value);
  const BUNpost = num(el("BUNpost").value);

  const dialysisTime = num(el("dialysisTime").value);

  const UF = num(el("UF").value);

  const height = num(el("height").value);

  const weightPre = num(el("weightPre").value);
  const weightPost = num(el("weightPost").value);

  const BMI = num(el("BMI").value);
  const Cr = num(el("Cr").value);
  const TCho = num(el("TCho").value);

  /* 補正Ca */
  const correctedCa =
    (Ca != null && Alb != null)
    ? (Ca + 0.8 * (4 - Alb))
    : null;

  /* TSAT */
  const TSAT =
    (Fe != null && TIBC != null && TIBC !== 0)
    ? (Fe / TIBC) * 100
    : null;

  /* spKt/V */
  let spKtV = null;

  if(
    BUNpre &&
    BUNpost &&
    dialysisTime &&
    UF != null &&
    weightPre
  ){

    const t = dialysisTime / 60;

    const R = BUNpost / BUNpre;

    if(R > 0){

      spKtV =
      (
        -Math.log(R - 0.008 * t)
        +
        (4 - 3.5 * R) * (UF / weightPre)
      );
    }
  }

  /* nPCR */
  const nPCR =
    BUNpre
    ? clamp((BUNpre / 60) * 1.2,0.5,1.6)
    : null;

  /* GNRI */
  let GNRI = null;

  if(Alb && height && weightPre){

    const ideal =
      22 * (height / 100) * (height / 100);

    GNRI =
      1.489 * (Alb * 10)
      +
      41.7 * (weightPre / ideal);
  }

  /* NRI-JH */
  let NRIJH = null;

  if(
    BMI != null &&
    Alb != null &&
    Cr != null &&
    TCho != null
  ){

    let score = 0;

    if(BMI < 20) score += 1;
    if(Alb < 3.6) score += 1;
    if(Cr < 10) score += 1;
    if(TCho < 130) score += 1;

    NRIJH = score;
  }

  let nriText = "—";

  if(NRIJH != null){

    if(NRIJH === 0) nriText = "低栄養リスクなし";
    else if(NRIJH === 1) nriText = "軽度リスク";
    else if(NRIJH === 2) nriText = "中等度リスク";
    else nriText = "高度リスク";
  }

  let html = "";

  html += `
  <div>
    <b>患者ID:</b> ${patientId || "—"}
    &nbsp;&nbsp;
    <b>採血日:</b> ${examDate || "—"}
  </div>
  `;

  html += `
  <div class="result-grid">

    <div class="kpi">
      <div class="label">spKt/V</div>
      <div class="value">${spKtV != null ? spKtV.toFixed(2) : "—"}</div>
    </div>

    <div class="kpi">
      <div class="label">GNRI</div>
      <div class="value">${GNRI != null ? GNRI.toFixed(1) : "—"}</div>
    </div>

    <div class="kpi">
      <div class="label">補正Ca</div>
      <div class="value">${correctedCa != null ? correctedCa.toFixed(2) : "—"}</div>
    </div>

    <div class="kpi">
      <div class="label">NRI-JH</div>
      <div class="value">${nriText}</div>
    </div>

  </div>
  `;

  html += `
  <table>

    <tr>
      <th>項目</th>
      <th>値</th>
      <th>目標</th>
      <th>判定</th>
    </tr>
  `;

  html += row("spKt/V",spKtV,"≥1.4",1.4,null);
  html += row("nPCR",nPCR,"0.9–1.2",0.9,1.2);
  html += row("Hb",Hb,"10–12",10,12);
  html += row("TSAT",TSAT,"≥20",20,null);
  html += row("Ferritin",Ferritin,"100–300",100,300);
  html += row("P",P,"3.5–5.5",3.5,5.5);
  html += row("補正Ca",correctedCa,"8.4–9.5",8.4,9.5);
  html += row("iPTH",iPTH,"60–240",60,240);
  html += row("Alb",Alb,"≥3.5",3.5,null);
  html += row("GNRI",GNRI,"≥92",92,null);

  html += `
  </table>
  `;

  html += `
  <div style="margin-top:16px;">

    <label><b>CEコメント</b></label>

    <textarea placeholder="コメント入力"></textarea>

  </div>
  `;

  el("results").innerHTML = html;

  el("results").style.display = "block";

  el("results").scrollIntoView({
    behavior:"smooth"
  });

}

/* 今日の日付 */
(function(){

  const d = new Date();

  el("examDate").value =
    d.toISOString().slice(0,10);

})();

</script>

</body>
</html>
